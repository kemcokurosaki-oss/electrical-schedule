<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電気進捗確認表</title>
  <!-- タブのアイコン（左上のロゴと同じ：カレンダー＋⚡） -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='5 4.75 22 22'%3E%3Crect x='6.5' y='8.5' width='19' height='17' rx='2.5' fill='%23fff' stroke='%232f3a4a' stroke-width='2'/%3E%3Cpath d='M6.5 13.5 H25.5 M12 6 V10 M20 6 V10' stroke='%232f3a4a' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M17.5 15.5 L13 21 H16 L15 24.5 L19.5 19 H16.5 Z' fill='%23e8a317'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
  <script src="m365-login.js"></script>
  <link rel="stylesheet" href="style.css?v=20261117v8">
  <link rel="stylesheet" href="denki-v2.css?v=20261117v8">
  <!-- ガントチャート（gantt.js・taskpanel.js・tasklist.js・vendor）はファイルを残したまま、読み込みを止めています -->
</head>
<body class="v2" data-view="sheet">

<div id="loading-overlay" class="visible">読み込み中...</div>

<div id="app">
  <!-- 左メニュー（細い表示だけ） -->
  <nav id="side-nav">
    <button class="v2-logo" id="nav-logo" type="button" title="電気工程表（ページを開き直す）">
      <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#fff"/><rect x="6.5" y="8.5" width="19" height="17" rx="2.5" fill="none" stroke="#2f3a4a" stroke-width="2"/><path d="M6.5 13.5 H25.5 M12 6 V10 M20 6 V10" stroke="#2f3a4a" stroke-width="2" stroke-linecap="round"/><path d="M17.5 15.5 L13 21 H16 L15 24.5 L19.5 19 H16.5 Z" fill="#e8a317"/></svg>
    </button>
    <button class="v2-nav-item active" id="tab-sheet" type="button" title="進捗確認表">進捗表</button>
    <button class="v2-nav-item" id="tab-minutes" type="button" title="議事録">議事録</button>
    <div class="v2-nav-pns" id="nav-projects"></div>
    <div class="v2-nav-bottom">
      <div class="v2-admin" id="nav-admin" hidden>
        <button class="v2-admin-btn" id="btn-admin" type="button" title="管理画面を開く">管理</button>
      </div>
      <!-- ここにログイン中のユーザー表示が入る（m365-login.js） -->
      <span id="nav-user-anchor" hidden></span>
    </div>
  </nav>

  <div id="main">
    <header id="app-bar" class="v2-bar">
      <span class="v2-title" id="view-title">進捗確認表</span>
      <div class="v2-meeting" id="meeting-box"></div>
      <span class="v2-save" id="save-status"></span>
      <div class="v2-legend" id="sheet-legend">
        <span><i class="lg late"></i>遅れ</span>
        <span><i class="lg soon"></i>注意</span>
        <span><i class="lg wip"></i>作業中</span>
        <span><i class="lg wait"></i>確認依頼中</span>
        <span><i class="lg order"></i>手配中</span>
        <span><i class="lg yet"></i>未着手</span>
        <span><i class="lg done"></i>完了</span>
        <span><i class="lg na"></i>対象外</span>
        <span><i class="lg missing"></i>日付なし</span>
        <span><i class="lg memo"></i>メモあり</span>
      </div>
    </header>

    <!-- 進捗確認表: 1台の機械を1行、項目を横に並べる。マスを押すと右に詳細 -->
    <div id="view-sheet" class="view active">
      <div id="sheet-wrap"></div>
      <aside id="sheet-detail" hidden></aside>
    </div>

    <!-- 議事録: 会議中の変更から自動で作る -->
    <div id="view-minutes" class="view">
      <aside id="minutes-side"></aside>
      <section id="minutes-main"></section>
    </div>
  </div>
</div>

<!-- 管理画面（工番・機械の登録／完了工番／ステップの設定）。中身は admin.js・manage.js が作る -->
<div class="v2-modal" id="admin-modal" hidden>
  <div class="v2-modal-bg" data-close="1"></div>
  <div class="v2-modal-box" id="admin-modal-box"></div>
</div>

<script src="config.js?v=20261117v8"></script>
<script src="state.js?v=20261117v8"></script>
<script src="utils.js?v=20261117v8"></script>
<script src="manage.js?v=20261117v8"></script>
<script src="minutes.js?v=20261117v8"></script>
<script src="sheet.js?v=20261117v8"></script>
<script src="admin.js?v=20261117v8"></script>
<script src="app.js?v=20261117v8"></script>
</body>
</html>
