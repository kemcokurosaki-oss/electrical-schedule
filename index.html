<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電気工程確認表</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
  <script src="m365-login.js"></script>
  <link rel="stylesheet" href="vendor/dhtmlxgantt-10.0.3/dhtmlxgantt.css">
  <script src="vendor/dhtmlxgantt-10.0.3/dhtmlxgantt.js"></script>
  <link rel="stylesheet" href="style.css?v=20261030d">
</head>
<body>

<div id="loading-overlay" class="visible">読み込み中...</div>

<header>
  <div class="tab-group">
    <button class="tab-btn active" id="tab-gantt">ガントチャート</button>
    <button class="tab-btn" id="tab-tasklist">タスクリスト</button>
    <button class="tab-btn" id="tab-minutes">議事録</button>
  </div>
  <button id="btn-manage">工番管理</button>
</header>

<!-- 工番管理モーダル -->
<div id="manage-modal">
  <div class="manage-box">
    <div class="manage-header">
      <h2>工番管理</h2>
      <button class="manage-close" id="manage-close">✕</button>
    </div>
    <div class="manage-body">
      <div class="manage-status-bar" id="manage-status"></div>
      <div class="manage-note">工番と機種は、プルダウンから選ぶか直接入力して「列を追加」を押してください。全体工程表に無い機種名（例: FSBT1）も入力できます。</div>
      <div class="manage-add-row">
        <input type="text" id="manage-add-pn" list="manage-pn-list" placeholder="工番" autocomplete="off">
        <datalist id="manage-pn-list"></datalist>
        <input type="text" id="manage-add-machine" list="manage-machine-list" placeholder="機種（空欄可）" autocomplete="off">
        <datalist id="manage-machine-list"></datalist>
        <button id="manage-add-btn">列を追加</button>
      </div>
      <div class="manage-list" id="manage-list"></div>
    </div>
  </div>
</div>

<!-- ガントビュー（メイン） -->
<div id="view-gantt" class="active">
  <div id="gantt-toolbar">
    <span class="toolbar-label">表示単位:</span>
    <button class="zoom-btn zoom-active" id="zoom-day">日</button>
    <button class="zoom-btn" id="zoom-week">週</button>
    <button id="btn-today">今日へ移動</button>
    <span class="toolbar-note">全体工程表の電気関係の工程（日付は全体工程表で変更）</span>
    <div class="gantt-legend">
      <span class="legend-item"><span class="legend-box denki"></span>電技</span>
      <span class="legend-item"><span class="legend-box denso"></span>電装</span>
      <span class="legend-item"><span class="legend-box sosou"></span>試運転</span>
      <span class="legend-item"><span class="legend-box ship"></span>工場出荷</span>
      <span class="legend-item"><span class="legend-box done"></span>完了</span>
    </div>
  </div>
  <div id="gantt-container"></div>
</div>

<!-- タスクリストビュー -->
<div id="view-tasklist">
  <div id="tasklist-wrapper"></div>
</div>

<!-- 議事録ビュー -->
<div id="view-minutes">
  <aside id="minutes-side">
    <label class="minutes-search">日付で検索<input type="date" id="minutes-date"></label>
    <button id="minutes-new">＋今日の議事録</button>
    <div id="minutes-list"></div>
  </aside>
  <section id="minutes-main"></section>
</div>

<script src="config.js?v=20261030d"></script>
<script src="state.js?v=20261030d"></script>
<script src="utils.js?v=20261030d"></script>
<script src="tasklist.js?v=20261030d"></script>
<script src="gantt.js?v=20261030d"></script>
<script src="manage.js?v=20261030d"></script>
<script src="minutes.js?v=20261030d"></script>
<script src="app.js?v=20261030d"></script>
</body>
</html>
