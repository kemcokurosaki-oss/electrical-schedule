<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電気進捗確認表</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
  <script src="m365-login.js"></script>
  <link rel="stylesheet" href="style.css?v=20261117v2">
  <link rel="stylesheet" href="denki-v2.css?v=20261117v2">
  <!-- ガントチャート（gantt.js・taskpanel.js・tasklist.js・vendor）はファイルを残したまま、読み込みを止めています -->
</head>
<body class="v2" data-view="sheet">

<div id="loading-overlay" class="visible">読み込み中...</div>

<div id="app">
  <!-- 左メニュー（細い表示だけ） -->
  <nav id="side-nav">
    <button class="v2-logo" id="nav-logo" type="button" title="電気工程表（ページを開き直す）">
      <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#fff"/><rect x="6.5" y="8.5" width="19" height="17" rx="2.5" fill="none" stroke="#2f3a4a" stroke-width="2"/><path d="M6.5 13.5 H25.5 M12 6 V10 M20 6 V10" stroke="#2f3a4a" stroke-width="2" stroke-linecap="round"/><path d="M17.5 15.5 L13 21 H16 L15 24.5 L19.5 19 H16.5 Z" fill="#e8a317"/></svg>
    </button>
    <button class="v2-nav-item active" id="tab-sheet" type="button" title="進捗確認表">進捗表</button>
    <button class="v2-nav-item" id="tab-minutes" type="button" title="議事録">議事録</button>
    <div class="v2-nav-pns" id="nav-projects"></div>
    <div class="v2-nav-bottom">
      <div class="v2-admin" id="nav-admin" hidden>
        <button class="v2-admin-btn" id="btn-admin" type="button" title="管理者メニュー">管理</button>
        <div class="v2-admin-menu" id="admin-menu" hidden>
          <div class="v2-admin-title">管理者メニュー</div>
          <button id="btn-manage" type="button">工番・機械の登録</button>
          <button id="btn-done-pns" type="button">完了工番</button>
          <button id="btn-steps" type="button">ステップの設定</button>
        </div>
      </div>
      <!-- ここにログイン中のユーザー表示が入る（m365-login.js） -->
      <span id="nav-user-anchor" hidden></span>
    </div>
  </nav>

  <div id="main">
    <header id="app-bar" class="v2-bar">
      <span class="v2-title" id="view-title">進捗確認表</span>
      <div class="v2-meeting" id="meeting-box"></div>
      <div class="v2-legend" id="sheet-legend">
        <span><i class="lg late"></i>遅れ</span>
        <span><i class="lg soon"></i>注意</span>
        <span><i class="lg wip"></i>作業中</span>
        <span><i class="lg wait"></i>確認依頼中</span>
        <span><i class="lg order"></i>手配中</span>
        <span><i class="lg yet"></i>未着手</span>
        <span><i class="lg done"></i>完了</span>
        <span><i class="lg na"></i>対象外</span>
        <span><i class="lg missing"></i>日付なし</span>
        <span><i class="lg memo"></i>メモあり</span>
      </div>
      <span class="v2-save" id="save-status"></span>
    </header>

    <!-- 進捗確認表: 1台の機械を1行、項目を横に並べる。マスを押すと右に詳細 -->
    <div id="view-sheet" class="view active">
      <div id="sheet-wrap"></div>
      <aside id="sheet-detail" hidden></aside>
    </div>

    <!-- 議事録: 会議中の変更から自動で作る -->
    <div id="view-minutes" class="view">
      <aside id="minutes-side"></aside>
      <section id="minutes-main"></section>
    </div>
  </div>
</div>

<!-- 工番・機械の登録（manage.js。中身は今までの工番管理と同じ） -->
<div id="manage-modal">
  <div class="manage-box">
    <div class="manage-header">
      <div class="manage-title">
        <h2>工番・機械の登録</h2>
        <span id="manage-status"></span>
      </div>
      <button class="btn btn-dark" id="manage-new-open">＋ 工番を追加</button>
      <button class="manage-close" id="manage-close">✕</button>
    </div>
    <div class="mg-new" id="manage-new" hidden>
      <div class="mg-new-row">
        <span class="mg-label">工番</span>
        <div class="mg-combo">
          <div class="mg-combo-box">
            <input type="text" id="manage-pn-input" placeholder="工番を入力・選択" autocomplete="off">
            <button type="button" id="manage-pn-toggle" tabindex="-1">▼</button>
          </div>
          <div class="mg-combo-list" id="manage-pn-list" hidden></div>
        </div>
        <span class="mg-new-cust" id="manage-new-cust"></span>
      </div>
      <div class="mg-new-machines" id="manage-new-machines" hidden>
        <div class="mg-new-mhead">
          <span class="mg-label">表示する機械・ユニット</span>
          <span class="mg-hint">全体工程表から拾っています。押して選択</span>
          <button class="link" id="manage-new-all">すべて選択</button>
        </div>
        <div class="mg-groups mg-groups-box" id="manage-new-groups"></div>
      </div>
      <div class="mg-warn" id="manage-new-warn" hidden>全体工程表に無い工番です。工番の番号を確認してください。</div>
      <div class="mg-new-btns">
        <button class="btn" id="manage-new-cancel">やめる</button>
        <button class="btn btn-dark" id="manage-new-add" disabled>追加</button>
      </div>
    </div>
    <div class="manage-body" id="manage-list"></div>
  </div>
</div>

<!-- 完了工番・ステップの設定（admin.js が中身を作る） -->
<div class="v2-modal" id="admin-modal" hidden>
  <div class="v2-modal-bg" data-close="1"></div>
  <div class="v2-modal-box" id="admin-modal-box"></div>
</div>

<script src="config.js?v=20261117v2"></script>
<script src="state.js?v=20261117v2"></script>
<script src="utils.js?v=20261117v2"></script>
<script src="manage.js?v=20261117v2"></script>
<script src="minutes.js?v=20261117v2"></script>
<script src="sheet.js?v=20261117v2"></script>
<script src="admin.js?v=20261117v2"></script>
<script src="app.js?v=20261117v2"></script>
</body>
</html>
